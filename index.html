<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MACuan Cht</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2d2f34;--panel:rgba(30,31,37,.78);--line:rgba(255,255,255,.1);--ink:#f3f2fa;--mute:#a9a7bd;--a:#7c5cff;--b:#22d3ee;--me:linear-gradient(135deg,#7c5cff,#c04bff);--r:18px;--fs:15px}
*{box-sizing:border-box;margin:0;font-family:Vazirmatn,Tahoma,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
button,input,textarea{font:inherit;color:inherit;border:0;outline:0}
button{cursor:pointer;background:none}
.hide{display:none!important}
.glass{background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line)}
.btn{background:var(--me);padding:11px 20px;border-radius:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)}
a.btn{display:inline-block;text-decoration:none;color:inherit;text-align:center}
.btn.g{background:rgba(255,255,255,.1);box-shadow:none}
input,textarea{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
input:focus,textarea:focus{border-color:var(--a)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--a)}
.av{width:44px;height:44px;border-radius:50%;background:var(--me) center/cover;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.av.lg{width:96px;height:96px;font-size:34px;cursor:pointer}
#login{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
#login .card{padding:44px 32px;border-radius:28px;max-width:380px;width:100%}
.logo{font-size:44px;font-weight:800;letter-spacing:-1px;direction:ltr;background:linear-gradient(90deg,#fff,#c9bcff 50%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:14px;font-weight:300;color:var(--mute);letter-spacing:6px;-webkit-text-fill-color:var(--mute)}
#login p{color:var(--mute);margin:18px 0 28px}
#gbtn{background:#fff;color:#222;width:100%;padding:13px;border-radius:14px;font-weight:600;display:flex;gap:10px;justify-content:center;align-items:center}
#app{height:100%;display:flex}
#side{width:360px;max-width:100%;display:flex;flex-direction:column;border-inline-end:1px solid var(--line)}
#tabs{display:flex;gap:6px;padding:10px 12px 0}
#tabs button{flex:1;padding:8px 4px;border-radius:12px;font-size:12.5px;background:rgba(255,255,255,.09)}
#tabs .on{background:var(--me)}
.top{display:flex;gap:8px;align-items:center;padding:10px 12px;position:relative}
.ib{width:40px;height:40px;border-radius:12px;font-size:20px;flex:none}
.ib:hover{background:rgba(255,255,255,.1)}
#list,.pane{flex:1;overflow:auto;min-height:0}
.pane{padding:16px;display:flex;flex-direction:column;gap:12px}
.pane .sec{padding:4px 0}
.row{display:flex;gap:12px;align-items:center;padding:11px 14px;cursor:pointer}
.row:hover,.row.on{background:color-mix(in srgb,var(--a) 24%,transparent)}
.row b{display:block;font-size:15px}.row span{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:230px}
.sec{padding:8px 16px;font-size:12px;color:var(--b)}
.empty{text-align:center;color:var(--mute);padding:30px 20px;font-size:14px;white-space:pre-line}
#nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;padding:8px 0;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mute)}
#nav button b{font-size:21px;font-weight:400}
#nav .on{color:var(--ink)}#nav .on b{filter:drop-shadow(0 0 6px var(--a))}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#ch{display:flex;gap:12px;align-items:center;padding:10px 14px;position:relative}
#ch .t{flex:1;min-width:0}#ch .t b{display:block}#ch .t span{font-size:12px;color:var(--mute)}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(78%,520px);padding:8px 12px;border-radius:var(--r);background:rgba(38,39,46,.9);align-self:flex-start;border-end-start-radius:4px;word-break:break-word;white-space:pre-wrap;font-size:var(--fs);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.m.me{align-self:flex-end;background:var(--me);border-end-start-radius:var(--r);border-end-end-radius:4px}
.m.hold{animation:hold 2s linear forwards}
@keyframes hold{to{box-shadow:0 0 0 3px var(--b);transform:scale(.97)}}
.m .n{font-size:12px;color:var(--b);font-weight:600;display:block}
.m img{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:4px 0;cursor:zoom-in}
.m a.f{display:flex;gap:8px;align-items:center;text-decoration:underline;color:#fff}
.m a.lk{display:inline;direction:ltr;unicode-bidi:embed;word-break:break-all;text-decoration:underline;color:#9be7ff}
.m time{font-size:10px;opacity:.6;display:block;text-align:end}
#emo{display:flex;gap:2px;overflow:auto;padding:6px 10px}#emo button{font-size:24px;padding:4px 6px;border-radius:10px}
#bar{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
#bar textarea{resize:none;max-height:120px;height:44px;border-radius:22px}
#ph{flex:1;display:grid;place-items:center;color:var(--mute);text-align:center}
.menu{position:absolute;top:56px;inset-inline-start:12px;min-width:200px;border-radius:16px;padding:6px;z-index:20;background:#2a2a33;box-shadow:0 16px 50px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:start;padding:11px 14px;border-radius:10px}
.menu button:hover{background:rgba(255,255,255,.09)}
.modal{position:fixed;inset:0;background:rgba(5,5,12,.7);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{width:100%;max-width:400px;padding:24px;border-radius:24px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto;background:#26262e}
.modal h3{text-align:center}
.err{color:#ff7d9a;font-size:13px;min-height:16px;text-align:center}
.mut{color:var(--mute);font-size:13px;text-align:center}
.ths{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.th{width:54px;height:54px;border-radius:14px;background:center/cover rgba(255,255,255,.08);position:relative;cursor:pointer;border:2px solid transparent}
.th.on{border-color:var(--b)}
.th i{position:absolute;top:-7px;inset-inline-end:-7px;background:#e11d48;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:grid;place-items:center;font-style:normal}
.hdr{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.sw{height:56px;border-radius:14px;font-size:12px;font-weight:600;border:2px solid transparent;text-shadow:0 1px 3px rgba(0,0,0,.7);color:#fff}
.sw.on{border-color:#fff}
.card{padding:14px;border-radius:16px;background:rgba(255,255,255,.08);display:flex;flex-direction:column;gap:10px;text-align:center}
.row2{display:flex;gap:8px}.row2 .btn{flex:1;padding:10px 6px;font-size:13px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#3a3a46;padding:10px 18px;border-radius:14px;z-index:99}
.ib svg,#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#send svg{transform:scaleX(-1);stroke:#fff}
.tag{font-style:normal;font-size:10px;font-weight:600;margin-inline-start:6px;padding:1px 7px;border-radius:8px;background:color-mix(in srgb,var(--a) 38%,transparent)}
.badge{margin-inline-start:auto;background:var(--me);border-radius:10px;padding:1px 9px;font-size:11px;font-weight:600}
.back{display:none}
@media(max-width:760px){#side{width:100%}#app.in #side{display:none}#app:not(.in) #main{display:none}.back{display:block!important}}
</style>
</head>
<body>

<div id="login">
  <div class="card glass">
    <div class="logo">MACuan<small>CHT</small></div>
    <p>پیام‌رسان سریع و زیبا؛ با حساب گوگل وارد شو و گفت‌وگو را شروع کن.</p>
    <button id="gbtn"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.700 2.400 30.300 0 24 0 14.600 0 6.500 5.400 2.600 13.200l7.800 6C12.300 13.600 17.700 9.500 24 9.500z"/><path fill="#4285F4" d="M46.500 24.500c0-1.600-.1-3.100-.4-4.500H24v9h12.700c-.6 3-2.300 5.500-4.800 7.200l7.600 5.900c4.400-4.100 7-10.100 7-17.600z"/><path fill="#FBBC05" d="M10.400 28.700c-.5-1.400-.8-3-.8-4.700s.3-3.200.8-4.700l-7.800-6C.9 16.500 0 20.100 0 24s.9 7.500 2.600 10.700l7.800-6z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.600-5.900c-2.100 1.400-4.900 2.300-8.300 2.300-6.300 0-11.700-4.200-13.600-9.900l-7.800 6C6.500 42.600 14.600 48 24 48z"/></svg>ورود با گوگل</button>
    <div class="err" id="lerr"></div>
  </div>
</div>

<div id="app" class="hide">
  <aside id="side" class="glass">
    <div id="tabs"><button data-t="group">گروه‌ها</button><button data-t="channel">کانال‌ها</button><button data-t="dm">پیام شخصی</button></div>
    <div class="top" id="topbar">
      <button class="ib" id="menuBtn">☰</button>
      <input id="q" placeholder="جست‌وجوی کانال، گروه یا @آیدی">
      <div class="menu hide" id="mainMenu">
        <button data-a="group">گروه جدید</button>
        <button data-a="channel">کانال جدید</button>
        <button data-a="logout">خروج</button>
      </div>
    </div>
    <div id="list"></div>
    <div id="pview" class="pane hide"></div>
    <div id="sview" class="pane hide"></div>
    <nav id="nav">
      <button data-v="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>پروفایل</button>
      <button data-v="chats" class="on"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>گفت‌وگو</button>
    </nav>
  </aside>
  <section id="main">
    <div id="ph"><div><div class="logo">MACuan<small>CHT</small></div><p class="mut" style="margin-top:14px">یک گفت‌وگو را انتخاب کن</p></div></div>
    <div id="chat" class="hide">
      <div id="ch" class="glass">
        <button class="ib back" id="back">➜</button>
        <div class="av" id="chAv"></div>
        <div class="t"><b id="chName"></b><span id="chSub"></span></div>
        <button class="ib" id="chatMenuBtn">⋮</button>
        <div class="menu hide" id="chatMenu"></div>
      </div>
      <div id="msgs"></div>
      <div id="bar" class="glass">
        <button class="ib" id="attBtn" title="فایل"><svg viewBox="0 0 24 24"><path d="M21 11l-9 9a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg></button>
        <button class="ib" id="imgBtn" title="عکس"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/></svg></button>
        <textarea id="txt" rows="1" placeholder="پیام..."></textarea>
        <button class="btn ib" id="send" style="width:46px;height:46px;padding:0"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></button>
        <button class="btn hide" id="joinBtn" style="flex:1">پیوستن</button>
        <span class="mut hide" id="ro" style="flex:1;padding:12px">فقط مدیران می‌توانند در کانال پیام بدهند</span>
      </div>
    </div>
  </section>
</div>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fAny" hidden>
<input type="file" id="fAv" accept="image/*" hidden>
<input type="file" id="fMulti" accept="image/*" multiple hidden>
<div id="modal"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,get,set,update,push,remove,onValue,onChildAdded,onChildChanged,onChildRemoved,query,orderByKey,startAt,endAt,limitToLast,serverTimestamp,onDisconnect} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app=initializeApp({
  apiKey:"AIzaSyChUirrjcWTE7jLMFGH0k21Zhyl5WrLFmQ",
  authDomain:"my-chat-app-398b3.firebaseapp.com",
  databaseURL:"https://my-chat-app-398b3-default-rtdb.firebaseio.com",
  projectId:"my-chat-app-398b3",
  storageBucket:"my-chat-app-398b3.firebasestorage.app",
  messagingSenderId:"48687943943",
  appId:"1:48687943943:web:e32733553fda92ee01b5a2"
});
const auth=getAuth(app),db=getDatabase(app);
const SITE='https://gamengrahman8-dot.github.io/MACuan-cht/',SUPPORT='09011268205',OFFICIAL='macuancht';
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e};
let me=null,uid=null,cur=null,curData=null,stopMsgs=null,stopX=null,chats={},watchers={},ucache={},avTmp=null,tab='',openedAt=0,reads={},pres=null,typers=0,started=false;
const botId=()=>'bot_'+uid,savedId=()=>'saved_'+uid,isPin=id=>id===botId()||id===savedId();
const pins=()=>({bot:{type:'bot',name:'ربات ماکوان',icon:'M',sub:'پاسخ‌گوی خودکار ماکوان',members:{[uid]:true}},saved:{type:'saved',name:'پیام‌های ذخیره‌شده',icon:'S',sub:'مخصوص خودت',members:{[uid]:true}}});
const isOwner=d=>!!d&&d.owner===uid,isAdm=d=>!!(d&&d.admins&&d.admins[uid]),staff=d=>isOwner(d)||isAdm(d);
const kind=d=>d.type==='channel'?'کانال':'گروه';
const toast=t=>{const d=el('div','',t);d.id='toast';document.body.append(d);setTimeout(()=>d.remove(),2400)};
const setAv=(n,photo,name)=>{n.style.backgroundImage=photo?`url(${photo})`:'';n.textContent=photo?'':(Array.from((name||'?').trim())[0]||'?').toUpperCase()};
const pick=i=>new Promise(r=>{i.value='';i.onchange=()=>r(i.files[0]);i.click()});
const pickMany=i=>new Promise(r=>{i.value='';i.onchange=()=>r([...i.files]);i.click()});
const readURL=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
async function shrink(f,max,q){
  const src=await readURL(f),im=new Image();im.src=src;await im.decode();
  const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
const clean=s=>(s||'').toLowerCase().replace(/[^a-z0-9_]/g,'');
const getUser=async id=>ucache[id]||(ucache[id]=(await get(ref(db,'users/'+id))).val()||{name:'کاربر'});
const linkify=(d,t)=>t.split(/(https?:\/\/\S+)/).forEach(p=>{if(/^https?:\/\//.test(p)){const a=el('a','lk',p);a.href=p;a.target='_blank';a.rel='noopener';d.append(a)}else if(p)d.append(document.createTextNode(p))});
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.05;o.start();o.stop(c.currentTime+.12)}catch(e){}}
async function copyT(t){try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();document.execCommand('copy');x.remove()}toast('کپی شد')}

/* ---------- themes & backgrounds ---------- */
let S={theme:'violet',bg:'emoji',fs:15,snd:true,bgImg:''};
try{S={...S,...JSON.parse(localStorage.getItem('mc_set')||'{}')}}catch(e){}
const saveS=()=>{try{localStorage.setItem('mc_set',JSON.stringify(S))}catch(e){toast('حجم عکس برای ذخیره زیاد است')}};
const THEMES={
  violet:{n:'بنفش',a:'#7c5cff',b:'#22d3ee',me:'linear-gradient(135deg,#7c5cff,#c04bff)'},
  ocean:{n:'اقیانوس',a:'#0ea5e9',b:'#67e8f9',me:'linear-gradient(135deg,#0369a1,#06b6d4)'},
  emerald:{n:'زمرد',a:'#10b981',b:'#a7f3d0',me:'linear-gradient(135deg,#047857,#34d399)'},
  rose:{n:'گل‌رز',a:'#f43f5e',b:'#fda4af',me:'linear-gradient(135deg,#be123c,#fb7185)'},
  amber:{n:'کهربا',a:'#f59e0b',b:'#fde68a',me:'linear-gradient(135deg,#b45309,#f59e0b)'}
};
const svgUrl=(svg,w)=>`url("data:image/svg+xml,${encodeURIComponent(svg)}") 0 0/${w}px ${w}px`;
const emojiTile=()=>{
  const E=['😀','🍕','🎧','🚀','🌙','⭐','🐱','🎈','☕','🌸','💬','🎮','📷','🍀','❤️','✈️'];let t='';
  E.forEach((e,i)=>{const x=(i%4)*80+20+(i*7%13),y=Math.floor(i/4)*80+52+(i*11%9),r=(i*37%50)-25;
    t+=`<text x="${x}" y="${y}" font-size="34" opacity=".2" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif" transform="rotate(${r} ${x} ${y})">${e}</text>`});
  return svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320">${t}</svg>`,320);
};
const aTile=()=>svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><text x="30" y="185" font-size="170" font-weight="900" fill="#b9a6ff" fill-opacity=".10" font-family="Arial Black,Arial" transform="rotate(-14 120 120)">A</text></svg>`,240);
const BGS={
  emoji:{n:'طرح خاکستری',c:()=>`${emojiTile()},linear-gradient(#4a4c52,#2f3136)`},
  letter:{n:'حرف A',c:()=>`${aTile()},radial-gradient(900px 600px at 85% -10%,rgba(124,92,255,.35),transparent),radial-gradient(800px 600px at -10% 110%,rgba(34,211,238,.22),transparent),#0d0a1c`},
  aurora:{n:'شفق',c:()=>'radial-gradient(700px 500px at 80% 0,rgba(34,211,238,.35),transparent),radial-gradient(700px 600px at 0 100%,rgba(192,75,255,.35),transparent),#12101f'},
  ocean:{n:'دریا',c:()=>'linear-gradient(160deg,#0f2027,#203a43,#2c5364)'},
  sunset:{n:'غروب',c:()=>'linear-gradient(160deg,#3a1c5a,#8a4a6e,#d98b5f)'},
  plain:{n:'ساده',c:()=>'#26272c'}
};
function applyS(){
  const t=THEMES[S.theme]||THEMES.violet,r=document.documentElement.style;
  r.setProperty('--a',t.a);r.setProperty('--b',t.b);r.setProperty('--me',t.me);r.setProperty('--fs',S.fs+'px');
  document.body.style.background=(S.bg==='img'&&S.bgImg)?`linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url("${S.bgImg}") center/cover`:(BGS[S.bg]||BGS.emoji).c();
}
applyS();

/* ---------- auth ---------- */
$('gbtn').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('lerr').textContent='ورود انجام نشد: '+e.code}};
onAuthStateChanged(auth,async u=>{
  if(!u){uid=null;$('login').classList.remove('hide');$('app').classList.add('hide');return}
  uid=u.uid;
  me=(await get(ref(db,'users/'+uid))).val();
  $('login').classList.add('hide');$('app').classList.remove('hide');
  if(!me){me={name:u.displayName||'',photo:'',bio:'',username:'',email:u.email};profileModal(true)}
  else startApp();
});
function startApp(){
  if(started)return;started=true;
  presence();
  (async()=>{await welcome();await autoJoin().catch(()=>{});await deepLink().catch(()=>{})})();
  onValue(ref(db,'reads/'+uid),s=>{reads=s.val()||{};renderList()});
  onValue(ref(db,'userChats/'+uid),s=>{
    const ids=Object.keys(s.val()||{});
    ids.forEach(id=>{if(watchers[id])return;watchers[id]=onValue(ref(db,'chats/'+id),async c=>{
      const d=c.val();

  if(S.bgImg){const rb=el('button','btn g','حذف عکس پس‌زمینه');rb.onclick=()=>{S.bgImg='';if(S.bg==='img')S.bg='emoji';saveS();applyS();re()};b.append(rb)}
  b.append(el('div','sec','اندازه متن پیام‌ها'));
  const r=el('input');r.type='range';r.min=12;r.max=22;r.value=S.fs;r.oninput=()=>{S.fs=+r.value;saveS();applyS()};b.append(r);
  const sn=el('button','btn g',S.snd?'صدای پیام: روشن':'صدای پیام: خاموش');sn.onclick=()=>{S.snd=!S.snd;saveS();re()};b.append(sn);
  b.append(el('div','sec','پشتیبانی'));
  const c=el('div','card'),r2=el('div','row2');
  const call=el('a','btn','تماس');call.href='tel:'+SUPPORT;
  const sms=el('a','btn','پیامک');sms.href='sms:'+SUPPORT;
  const cp=el('button','btn g','کپی');cp.onclick=()=>copyT(SUPPORT);
  r2.append(call,sms,cp);c.append(el('div',null,'برای راهنمایی یا گزارش مشکل با ما در تماس باش'),el('b',null,SUPPORT),r2);b.append(c);
}
function createModal(type){
  modal((b,close)=>{
    b.append(el('h3',null,type==='channel'?'کانال جدید':'گروه جدید'));
    const av=el('div','av lg');av.style.margin='0 auto';setAv(av,'',type==='channel'?'C':'G');let ph='';
    av.onclick=async()=>{const f=await pick($('fAv'));if(f){ph=await shrink(f,256,.8);setAv(av,ph)}};b.append(av,el('div','mut','برای انتخاب عکس بزن'));
    const n=field(b,'نام'),h=field(b,'آیدی عمومی (انگلیسی)'),d=field(b,'بیوگرافی / توضیحات',0,1),er=el('div','err');h.style.direction='ltr';b.append(er);
    const ok=el('button','btn','ساخت');b.append(ok);closeBtn(b,close);
    ok.onclick=async()=>{
      const hd=clean(h.value),nm=n.value.trim();
      if(!nm)return er.textContent='نام را وارد کن';
      if(hd.length<3)return er.textContent='آیدی حداقل ۳ حرف باشد';
      if((await get(ref(db,'handles/'+hd))).exists())return er.textContent='این آیدی گرفته شده';
      const id=push(ref(db,'chats')).key;
      await update(ref(db),{['chats/'+id]:{type,name:nm,handle:hd,desc:d.value.trim(),photo:ph,owner:uid,members:{[uid]:true},lastTs:Date.now()},['handles/'+hd]:id,['userChats/'+uid+'/'+id]:true});
      close();toast('ساخته شد');
    };
  });
}
async function infoModal(){
  const d=curData,g=d.type==='group'||d.type==='channel';let other=null;
  if(d.type==='dm')other=await getUser(Object.keys(d.members||{}).find(k=>k!==uid));
  modal((b,close)=>{
    const av=el('div','av lg');av.style.margin='0 auto';setAv(av,d.photo,d.icon||d.name);
    b.append(av,el('h3',null,d.name||''));
    if(d.handle)b.append(el('div','mut','@'+d.handle));
    const t=other?other.bio:d.desc;if(t)b.append(el('p',null,t));
    if(g){b.append(el('div','mut',Object.keys(d.members||{}).length+' عضو'));const mb=el('button','btn','مشاهده اعضا');mb.onclick=()=>{close();membersModal()};b.append(mb)}
    closeBtn(b,close);
  });
}
/* ---------- مدیریت: اعضا، مدیر، حذف، ویرایش ---------- */
function membersModal(){
  const id=cur,d=curData;
  modal((b,close)=>{
    b.append(el('h3',null,'اعضا ('+Object.keys(d.members||{}).length+')'));
    const L=el('div');L.style.cssText='display:flex;flex-direction:column;gap:2px;overflow:auto';b.append(L);
    (async()=>{
      const ids=Object.keys(d.members||{}).slice(0,200),us=await Promise.all(ids.map(i=>getUser(i)));
      const rank=i=>d.owner===i?0:(d.admins&&d.admins[i])?1:2;
      ids.map((i,k)=>[i,us[k]]).sort((a,c)=>rank(a[0])-rank(c[0])).forEach(([i,u])=>{
        const r=el('div','row'),a=el('div','av');setAv(a,u.photo,u.name);
        const t=el('div'),bn=el('b',null,u.name||''),role=rank(i)===0?'مالک':rank(i)===1?'مدیر':'';
        if(role)bn.append(el('i','tag',role));
        t.append(bn,el('span',null,u.username?'@'+u.username:''));r.append(a,t);
        r.onclick=()=>{close();userModal(i,u)};L.append(r);
      });
    })();
    closeBtn(b,close);
  });
}
function userModal(i,u){
  const id=cur,d=curData;
  modal((b,close)=>{
    const av=el('div','av lg');av.style.margin='0 auto';setAv(av,u.photo,u.name);
    b.append(av,el('h3',null,u.name||''));
    if(u.username)b.append(el('div','mut','@'+u.username));
    if(u.bio)b.append(el('p',null,u.bio));
    const adm=!!(d.admins&&d.admins[i]);
    b.append(el('div','mut','نقش: '+(i===d.owner?'مالک':adm?'مدیر':'عضو')));
    const add=(t,f,g)=>{const x=el('button','btn'+(g?' g':''),t);x.onclick=async()=>{close();await f()};b.append(x)};
    if(i!==uid)add('ارسال پیام',()=>openDM(i));
    if(isOwner(d)&&i!==uid){
      if(adm)add('لغو مدیریت',()=>update(ref(db),{['chats/'+id+'/admins/'+i]:null}).then(()=>toast('مدیریت لغو شد')),1);
      else add('ارتقا به مدیر',()=>update(ref(db),{['chats/'+id+'/admins/'+i]:true}).then(()=>toast('به مدیر ارتقا یافت')),1);
    }
    if(i!==uid&&i!==d.owner&&(isOwner(d)||(isAdm(d)&&!adm)))
      add('حذف از '+kind(d),()=>{if(confirm('این کاربر حذف شود؟'))return update(ref(db),{['chats/'+id+'/members/'+i]:null,['chats/'+id+'/admins/'+i]:null,['userChats/'+i+'/'+id]:null}).then(()=>toast('حذف شد'))},1);
    closeBtn(b,close);
  });
}
function editChatModal(){
  const id=cur,d=curData;let ph=d.photo||'';
  modal((b,close)=>{
    b.append(el('h3',null,'ویرایش '+kind(d)));
    const av=el('div','av lg');av.style.margin='0 auto';setAv(av,ph,d.name);
    av.onclick=async()=>{const f=await pick($('fAv'));if(f){ph=await shrink(f,256,.8);setAv(av,ph,d.name)}};
    b.append(av,el('div','mut','برای تغییر عکس بزن'));
    const n=field(b,'نام',d.name),bio=field(b,'بیوگرافی / توضیحات',d.desc,1);
    const ok=el('button','btn','ذخیره'),rp=el('button','btn g','حذف عکس');
    rp.onclick=()=>{ph='';setAv(av,'',d.name)};
    ok.onclick=async()=>{const nm=n.value.trim();if(!nm)return toast('نام را وارد کن');await update(ref(db,'chats/'+id),{name:nm,desc:bio.value.trim(),photo:ph});close();toast('ذخیره شد')};
    b.append(ok,rp);closeBtn(b,close);
  });
}
