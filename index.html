<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MACuan Cht</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2d2f34;--panel:rgba(30,31,37,.78);--line:rgba(255,255,255,.1);--ink:#f3f2fa;--mute:#a9a7bd;--a:#7c5cff;--b:#22d3ee;--me:linear-gradient(135deg,#7c5cff,#c04bff);--r:18px;--fs:15px}
*{box-sizing:border-box;margin:0;font-family:Vazirmatn,Tahoma,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;border:0;outline:0}
button{cursor:pointer;background:none}
.hide{display:none!important}
.glass{background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line)}
.btn{background:var(--me);padding:11px 20px;border-radius:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)}
a.btn{display:inline-block;text-decoration:none;color:inherit;text-align:center}
.btn.g{background:rgba(255,255,255,.1);box-shadow:none}
.btn.danger{background:#e11d48;color:#fff}
input,textarea,select{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--a)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--a)}
.av{width:44px;height:44px;border-radius:50%;background:var(--me) center/cover;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden;position:relative}
.av.lg{width:96px;height:96px;font-size:34px;cursor:pointer}
#login{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
#login .card{padding:36px 28px;border-radius:28px;max-width:390px;width:100%;display:flex;flex-direction:column;gap:12px}
.logo{font-size:44px;font-weight:800;letter-spacing:-1px;direction:ltr;background:linear-gradient(90deg,#fff,#c9bcff 50%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:14px;font-weight:300;color:var(--mute);letter-spacing:6px;-webkit-text-fill-color:var(--mute)}
#login p{color:var(--mute);margin:6px 0 8px;font-size:14px}
#gbtn{background:#fff;color:#222;width:100%;padding:13px;border-radius:14px;font-weight:600;display:flex;gap:10px;justify-content:center;align-items:center}
.div-or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;margin:2px 0}
.div-or::before,.div-or::after{content:'';flex:1;height:1px;background:var(--line)}
#app{height:100%;display:flex}
#side{width:360px;max-width:100%;display:flex;flex-direction:column;border-inline-end:1px solid var(--line);position:relative}
#tabs{display:flex;gap:6px;padding:10px 12px 0}
#tabs button{flex:1;padding:8px 4px;border-radius:12px;font-size:12.5px;background:rgba(255,255,255,.09)}
#tabs .on{background:var(--me)}
.top{display:flex;gap:8px;align-items:center;padding:10px 12px;position:relative}
.ib{width:40px;height:40px;border-radius:12px;font-size:20px;flex:none;display:grid;place-items:center}
.ib:hover{background:rgba(255,255,255,.1)}
#storiesBar{display:flex;gap:12px;padding:8px 14px;overflow-x:auto;border-bottom:1px solid var(--line);flex:none}
#storiesBar:empty{display:none}
.st-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:58px;flex:none}
.st-ring{padding:2.5px;border-radius:50%;background:var(--me)}
.st-ring.seen{background:rgba(255,255,255,.25)}
.st-ring .av{width:48px;height:48px;border:2px solid #26272c}
.st-item span{font-size:11px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58px}
#list,.pane{flex:1;overflow:auto;min-height:0}
.pane{padding:16px;display:flex;flex-direction:column;gap:12px}
.pane .sec{padding:4px 0}
.row{display:flex;gap:12px;align-items:center;padding:11px 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.row:hover,.row.on{background:color-mix(in srgb,var(--a) 24%,transparent)}
.row.hold{animation:hold 2s linear forwards}
.row b{display:block;font-size:15px}.row span{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:230px}
.sec{padding:8px 16px;font-size:12px;color:var(--b)}
.empty{text-align:center;color:var(--mute);padding:30px 20px;font-size:14px;white-space:pre-line}
#fab{position:absolute;bottom:68px;left:18px;width:52px;height:52px;border-radius:50%;background:var(--me);color:#fff;font-size:28px;display:grid;place-items:center;box-shadow:0 8px 25px rgba(0,0,0,.45);z-index:15;transition:transform .2s}
#fab:active{transform:scale(.92)}
#fabMenu{position:absolute;bottom:128px;left:18px;min-width:190px;border-radius:16px;padding:6px;z-index:25;background:#2a2a33;box-shadow:0 16px 50px rgba(0,0,0,.6);border:1px solid var(--line)}
#fabMenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:11px 14px;border-radius:10px;font-size:14px}
#fabMenu button:hover{background:rgba(255,255,255,.1)}
#nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;padding:8px 0;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mute)}
#nav button b{font-size:21px;font-weight:400}
#nav .on{color:var(--ink)}#nav .on b{filter:drop-shadow(0 0 6px var(--a))}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#ch{display:flex;gap:12px;align-items:center;padding:10px 14px;position:relative;cursor:pointer}
#ch .t{flex:1;min-width:0}#ch .t b{display:block}#ch .t span{font-size:12px;color:var(--mute)}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(78%,520px);padding:8px 12px;border-radius:var(--r);background:rgba(38,39,46,.9);align-self:flex-start;border-end-start-radius:4px;word-break:break-word;white-space:pre-wrap;font-size:var(--fs);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.m.me{align-self:flex-end;background:var(--me);border-end-start-radius:var(--r);border-end-end-radius:4px}
.m.hold{animation:hold 2s linear forwards}
@keyframes hold{to{box-shadow:0 0 0 3px var(--b);transform:scale(.97)}}
.m .n{font-size:12px;color:var(--b);font-weight:600;display:inline-block;cursor:pointer;margin-bottom:2px}
.m .n:hover{text-decoration:underline}
.m img{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:4px 0;cursor:zoom-in}
.m a.f{display:flex;gap:8px;align-items:center;text-decoration:underline;color:#fff}
.m a.lk{display:inline;direction:ltr;unicode-bidi:embed;word-break:break-all;text-decoration:underline;color:#9be7ff}
.m time{font-size:10px;opacity:.6;display:block;text-align:end}
#bar{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
#bar textarea{resize:none;max-height:120px;height:44px;border-radius:22px}
#ph{flex:1;display:grid;place-items:center;color:var(--mute);text-align:center}
.menu{position:absolute;top:56px;inset-inline-start:12px;min-width:200px;border-radius:16px;padding:6px;z-index:20;background:#2a2a33;box-shadow:0 16px 50px rgba(0,0,0,.5);border:1px solid var(--line)}
.menu button{display:block;width:100%;text-align:start;padding:11px 14px;border-radius:10px}
.menu button:hover{background:rgba(255,255,255,.09)}
.modal{position:fixed;inset:0;background:rgba(5,5,12,.75);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{width:100%;max-width:410px;padding:24px;border-radius:24px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto;background:#26262e}
.modal h3{text-align:center}
.err{color:#ff7d9a;font-size:13px;min-height:16px;text-align:center}
.mut{color:var(--mute);font-size:13px;text-align:center}
.ths{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.th{width:54px;height:54px;border-radius:14px;background:center/cover rgba(255,255,255,.08);position:relative;cursor:pointer;border:2px solid transparent}
.th.on{border-color:var(--b)}
.th i{position:absolute;top:-7px;inset-inline-end:-7px;background:#e11d48;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:grid;place-items:center;font-style:normal}
.hdr{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.sw{height:56px;border-radius:14px;font-size:12px;font-weight:600;border:2px solid transparent;text-shadow:0 1px 3px rgba(0,0,0,.7);color:#fff}
.sw.on{border-color:#fff}
.card{padding:14px;border-radius:16px;background:rgba(255,255,255,.08);display:flex;flex-direction:column;gap:10px;text-align:center}
.row2{display:flex;gap:8px}.row2 .btn{flex:1;padding:10px 6px;font-size:13px}
.priv-opts{display:flex;gap:6px;margin-top:4px}
.priv-opts button{flex:1;padding:9px 4px;border-radius:12px;background:rgba(255,255,255,.08);font-size:12px;border:1.5px solid transparent}
.priv-opts button.on{border-color:var(--b);background:color-mix(in srgb,var(--a) 28%,transparent);font-weight:600}
.story-viewer{position:fixed;inset:0;background:#0a0a0f;z-index:80;display:flex;flex-direction:column;justify-content:space-between}
.sv-top{padding:16px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);z-index:2}
.sv-prog{display:flex;gap:4px;padding:10px 14px 0;z-index:2}
.sv-prog div{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.sv-prog div i{display:block;height:100%;background:#fff;width:0}
.sv-media{position:absolute;inset:0;display:grid;place-items:center}
.sv-media img,.sv-media video{max-width:100%;max-height:100%;object-fit:contain}
.sv-cap{padding:20px;text-align:center;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);z-index:2;font-size:15px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#3a3a46;padding:10px 18px;border-radius:14px;z-index:99;box-shadow:0 8px 25px rgba(0,0,0,.4)}
.ib svg,#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#send svg{transform:scaleX(-1);stroke:#fff}
.tag{font-style:normal;font-size:10px;font-weight:600;margin-inline-start:6px;padding:1px 7px;border-radius:8px;background:color-mix(in srgb,var(--a) 38%,transparent)}
.badge{margin-inline-start:auto;background:var(--me);border-radius:10px;padding:1px 9px;font-size:11px;font-weight:600}
.back{display:none}
@media(max-width:760px){#side{width:100%}#app.in #side{display:none}#app:not(.in) #main{display:none}.back{display:block!important}}
</style>
</head>
<body>

<div id="login">
  <div class="card glass">

<div id="app" class="hide">
  <aside id="side" class="glass">

<script type="module">

try{S={...S,...JSON.parse(localStorage.getItem('mc_set')||'{}')}}catch(e){}
const saveS=()=>{try{localStorage.setItem('mc_set',JSON.stringify(S))}catch(e){toast('حجم عکس برای ذخیره زیاد است')}};
const THEMES={
  violet:{n:'بنفش',a:'#7c5cff',b:'#22d3ee',me:'linear-gradient(135deg,#7c5cff,#c04bff)'},
  ocean:{n:'اقیانوس',a:'#0ea5e9',b:'#67e8f9',me:'linear-gradient(135deg,#0369a1,#06b6d4)'},
  emerald:{n:'زمرد',a:'#10b981',b:'#a7f3d0',me:'linear-gradient(135deg,#047857,#34d399)'},
  rose:{n:'گل‌رز',a:'#f43f5e',b:'#fda4af',me:'linear-gradient(135deg,#be123c,#fb7185)'},
  amber:{n:'کهربا',a:'#f59e0b',b:'#fde68a',me:'linear-gradient(135deg,#b45309,#f59e0b)'}
};
const svgUrl=(svg,w)=>`url("data:image/svg+xml,${encodeURIComponent(svg)}") 0 0/${w}px ${w}px`;
const emojiTile=()=>{
  const E=['😀','🍕','🎧','🚀','🌙','⭐','🐱','🎈','☕','🌸','💬','🎮','📷','🍀','❤️','✈️'];let t='';
  E.forEach((e,i)=>{const x=(i%4)*80+20+(i*7%13),y=Math.floor(i/4)*80+52+(i*11%9),r=(i*37%50)-25;
    t+=`<text x="${x}" y="${y}" font-size="34" opacity=".2" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif" transform="rotate(${r} ${x} ${y})">${e}</text>`});
  return svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320">${t}</svg>`,320);
};
const aTile=()=>svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><text x="30" y="185" font-size="170" font-weight="900" fill="#b9a6ff" fill-opacity=".10" font-family="Arial Black,Arial" transform="rotate(-14 120 120)">A</text></svg>`,240);
const BGS={
  emoji:{n:'طرح خاکستری',c:()=>`${emojiTile()},linear-gradient(#4a4c52,#2f3136)`},
  letter:{n:'حرف A',c:()=>`${aTile()},radial-gradient(900px 600px at 85% -10%,rgba(124,92,255,.35),transparent),radial-gradient(800px 600px at -10% 110%,rgba(34,211,238,.22),transparent),#0d0a1c`},
  aurora:{n:'شفق',c:()=>'radial-gradient(700px 500px at 80% 0,rgba(34,211,238,.35),transparent),radial-gradient(700px 600px at 0 100%,rgba(192,75,255,.35),transparent),#12101f'},
  ocean:{n:'دریا',c:()=>'linear-gradient(160deg,#0f2027,#203a43,#2c5364)'},
  sunset:{n:'غروب',c:()=>'linear-gradient(160deg,#3a1c5a,#8a4a6e,#d98b5f)'},
  plain:{n:'ساده',c:()=>'#26272c'}
};
function applyS(){
  const t=THEMES[S.theme]||THEMES.violet,r=document.documentElement.style;
  r.setProperty('--a',t.a);r.setProperty('--b',t.b);r.setProperty('--me',t.me);r.setProperty('--fs',S.fs+'px');
  document.body.style.background=(S.bg==='img'&&S.bgImg)?`linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url("${S.bgImg}") center/cover`:(BGS[S.bg]||BGS.emoji).c();
}
applyS();

onAuthStateChanged(auth,async u=>{
  if(!u){uid=null;$('login').classList.remove('hide');$('app').classList.add('hide');return}
  uid=u.uid;
  me=(await get(ref(db,'users/'+uid))).val();
  $('login').classList.add('hide');$('app').classList.remove('hide');
  if(!me){me={name:u.displayName||'',photo:'',bio:'',username:'',email:u.email||'',phone:u.phoneNumber||''};profileModal(true)}
  else startApp();
});
function startApp(){
  if(started)return;started=true;
  presence();
  (async()=>{await welcome();await autoJoin().catch(()=>{});await deepLink().catch(()=>{})})();
  onValue(ref(db,'reads/'+uid),s=>{reads=s.val()||{};renderList()});
  onValue(ref(db,'contacts/'+uid),s=>{contacts=s.val()||{};renderStories()});
  onValue(ref(db,'stories'),s=>{stories=s.val()||{};renderStories()});
  onValue(ref(db,'userChats/'+uid),s=>{
    const ids=Object.keys(s.val()||{});
    ids.forEach(id=>{if(watchers[id])return;watchers[id]=onValue(ref(db,'chats/'+id),async c=>{
      const d=c.val();
      if(!d||!d.members||!d.members[uid]){delete chats[id];renderList();if(d&&id===cur){curData=d;head()}return}
      if(d.type==='dm'){const o=Object.keys(d.members).find(k=>k!==uid),ou=await getUser(o);d.name=ou.name;d.photo=ou.photo;d.handle=ou.username}
      chats[id]=d;renderList();if(id===cur){curData=d;head()}
    })});
    Object.keys(chats).forEach(id=>{if(!ids.includes(id))delete chats[id]});renderList();
  });
}
function presence(){onValue(ref(db,'.info/connected'),s=>{if(!s.val())return;const p=ref(db,'presence/'+uid);onDisconnect(p).set(Date.now()).then(()=>set(p,true))})}
async function autoJoin(){
  const fk='flags/'+uid+'/aj_'+OFFICIAL;
  if((await get(ref(db,fk))).val())return;
  let id=(await get(ref(db,'handles/'+OFFICIAL))).val();
  if(!id){
    id=push(ref(db,'chats')).key;
    await update(ref(db),{['chats/'+id]:{type:'channel',name:'MACuan Cht',handle:OFFICIAL,desc:'کانال رسمی ماکوان',photo:'',owner:uid,members:{[uid]:true},lastTs:Date.now()},['handles/'+OFFICIAL]:id,['userChats/'+uid+'/'+id]:true});
  }else await update(ref(db),{['chats/'+id+'/members/'+uid]:true,['userChats/'+uid+'/'+id]:true});
  await set(ref(db,fk),true);
}
async function deepLink(){
  const c=clean(new URLSearchParams(location.search).get('c'));if(!c)return;
  const id=(await get(ref(db,'handles/'+c))).val();if(!id)return;
  const d=(await get(ref(db,'chats/'+id))).val();if(d)openChat(id,d);
}

  t=t.trim().toLowerCase();const has=(...k)=>k.some(x=>t.includes(x));let r;
  if(has('راهنما','help','دستور'))r='دستورهای ربات:
- ساعت: تاریخ و ساعت الان
- پروفایل: اطلاعات حساب تو
- پشتیبانی: راه تماس با پشتیبانی
- لینک: لینک سایت
- کانال: کانال رسمی ماکوان
- آمار: تعداد چت‌های تو';
  else if(has('سلام','درود','hello'))r=`سلام ${me.name||''}. من ربات ماکوان هستم. برای دیدن دستورها بنویس: راهنما`;
  else if(has('ساعت','تاریخ','time'))r='الان: '+new Date().toLocaleString('fa-IR',{dateStyle:'full',timeStyle:'short'});
  else if(has('پروفایل','حساب'))r=`نام: ${me.name}
نام کاربری: @${me.username}
بیوگرافی: ${me.bio||'ندارد'}`;
  else if(has('پشتیبان','support'))r='شماره پشتیبانی: '+SUPPORT;
  else if(has('لینک','سایت'))r=SITE;
  else if(has('کانال'))r='کانال رسمی ماکوان: @'+OFFICIAL+'
'+SITE+'?c='+OFFICIAL;
  else if(has('آمار'))r='تعداد چت‌های تو: '+Object.keys(chats).length;
  else r='متوجه نشدم. برای دیدن دستورها بنویس: راهنما';
  setTimeout(()=>push(ref(db,'messages/'+botId()),{uid:'bot',ts:Date.now(),text:r}),500);
}

/* ---------- Stories ---------- */
async function renderStories(){
  const bar=$('storiesBar');bar.innerHTML='';
  const now=Date.now(),day=24*60*60*1000;
  const validByUser={};
  Object.entries(stories).forEach(([ownerId,userStories])=>{
    const items=Object.entries(userStories||{}).map(([sid,st])=>({sid,...st})).filter(st=>{
      if(now-(st.ts||0)>day)return false;
      if(ownerId===uid)return true;
      if(st.privacy==='private')return false;
      if(st.privacy==='contacts')return !!contacts[ownerId];
      return true; // public
    }).sort((a,b)=>a.ts-b.ts);
    if(items.length)validByUser[ownerId]=items;
  });

  // Always show "My Story" add button first
  const myAdd=el('div','st-item');
  const myRing=el('div','st-ring'+(validByUser[uid]?'':' seen'));
  const myAv=el('div','av');setAv(myAv,me?.photo,me?.name||'من');
  myRing.append(myAv);
  myAdd.append(myRing,el('span',null,validByUser[uid]?'استوری من':'+ استوری'));
  myAdd.onclick=()=>{if(validByUser[uid])viewStories(uid,validByUser[uid]);else openStoryComposer()};
  bar.append(myAdd);

  for(const [ownerId,items] of Object.entries(validByUser)){
    if(ownerId===uid)continue;
    const u=await getUser(ownerId);
    const it=el('div','st-item');
    const ring=el('div','st-ring');
    const av=el('div','av');setAv(av,u.photo,u.name);
    ring.append(av);
    it.append(ring,el('span',null,u.name||'کاربر'));
    it.onclick=()=>viewStories(ownerId,items);
    bar.append(it);
  }
}

function openStoryComposer(){
  modal((b,close)=>{
    b.append(el('h3',null,'ارسال استوری جدید'));
    let file=null,dataUrl='',isVid=false,privacy='public';
    const preview=el('div','card');preview.style.minHeight='140px';preview.style.justifyContent='center';
    preview.append(el('div','mut','عکس یا ویدیو را انتخاب کن'));
    const pickBtn=el('button','btn g','انتخاب عکس یا ویدیو');
    pickBtn.onclick=async()=>{
      const f=await pick($('fStory'));if(!f)return;
      isVid=f.type.startsWith('video/');
      if(isVid&&f.size>3.5*1024*1024)return toast('حداکثر حجم ویدیو استوری ۳.۵ مگابایت است');
      file=f;
      dataUrl=isVid?await readURL(f):await shrink(f,1080,.78);
      preview.innerHTML='';
      if(isVid){const v=el('video');v.src=dataUrl;v.controls=true;v.style.maxHeight='200px';v.style.borderRadius='12px';preview.append(v)}
      else{const im=new Image();im.src=dataUrl;im.style.maxHeight='200px';im.style.borderRadius='12px';im.style.margin='0 auto';preview.append(im)}
    };
    b.append(preview,pickBtn);
    const cap=field(b,'توضیحات استوری (اختیاری)');
    b.append(el('div','sec','چه کسانی ببینند؟'));
    const pWrap=el('div','priv-opts');
    const opts=[['public','عمومی'],['contacts','فقط آشناهایتان'],['private','خصوصی']];
    const renderOpts=()=>{
      pWrap.innerHTML='';
      opts.forEach(([k,label])=>{
        const btn=el('button',privacy===k?'on':'',label);
        btn.onclick=()=>{privacy=k;renderOpts()};
        pWrap.append(btn);
      });
    };
    renderOpts();b.append(pWrap);
    const pubBtn=el('button','btn','انتشار استوری');
    pubBtn.onclick=async()=>{
      if(!dataUrl)return toast('ابتدا عکس یا ویدیو انتخاب کن');
      pubBtn.disabled=true;pubBtn.textContent='در حال ارسال...';
      try{
        await push(ref(db,'stories/'+uid),{
          media:dataUrl,
          mediaType:isVid?'video':'image',
          caption:cap.value.trim(),
          privacy,
          ts:Date.now()
        });
        close();toast('استوری منتشر شد');
      }catch(e){
        pubBtn.disabled=false;pubBtn.textContent='انتشار استوری';
        toast('خطا در انتشار استوری (حجم فایل زیاد است)');
      }
    };
    b.append(pubBtn);closeBtn(b,close);
  });
}

async function viewStories(ownerId,items){
  let idx=0,timer=null;
  const u=ownerId===uid?me:await getUser(ownerId);
  const sv=el('div','story-viewer');
  const prog=el('div','sv-prog');
  items.forEach(()=>prog.append(el('div','',null)));
  prog.querySelectorAll('div').forEach(d=>d.append(el('i')));
  const top=el('div','sv-top');
  const av=el('div','av');setAv(av,u.photo,u.name);
  const info=el('div');info.style.flex='1';
  const privMap={public:'عمومی',contacts:'فقط آشناها',private:'خصوصی'};
  info.append(el('b',null,u.name||'کاربر'),el('div','mut',''));
  info.querySelector('.mut').style.textAlign='start';
  const cls=el('button','ib','✕');cls.style.fontSize='22px';
  cls.onclick=()=>{clearTimeout(timer);sv.remove()};
  top.append(av,info);
  if(ownerId===uid){
    const addMore=el('button','btn g','+ جدید');addMore.style.padding='6px 12px';addMore.style.fontSize='12px';
    addMore.onclick=()=>{clearTimeout(timer);sv.remove();openStoryComposer()};
    const delBtn=el('button','btn danger','حذف');delBtn.style.padding='6px 12px';delBtn.style.fontSize='12px';
    delBtn.onclick=async()=>{
      clearTimeout(timer);
      await remove(ref(db,'stories/'+uid+'/'+items[idx].sid));
      sv.remove();toast('استوری حذف شد');
    };
    top.append(addMore,delBtn);
  }
  top.append(cls);
  const mediaBox=el('div','sv-media');
  const capBox=el('div','sv-cap');
  sv.append(prog,top,mediaBox,capBox);
  document.body.append(sv);

  const show=i=>{
    clearTimeout(timer);
    if(i>=items.length){sv.remove();return}
    if(i<0)i=0;
    idx=i;
    const st=items[idx];
    prog.querySelectorAll('i').forEach((bar,bi)=>{
      bar.style.transition='none';
      bar.style.width=bi<idx?'100%':'0%';
    });
    const tmStr=new Date(st.ts).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
    info.querySelector('.mut').textContent=tmStr+(ownerId===uid?' • '+(privMap[st.privacy]||'عمومی'):'');
    mediaBox.innerHTML='';
    capBox.textContent=st.caption||'';
    capBox.classList.toggle('hide',!st.caption);
    const curBar=prog.querySelectorAll('i')[idx];
    if(st.mediaType==='video'){
      const v=el('video');v.src=st.media;v.autoplay=true;v.playsInline=true;
      v.onloadedmetadata=()=>{
        const dur=Math.min(v.duration||15,30)*1000;
        requestAnimationFrame(()=>{curBar.style.transition=`width ${dur}ms linear`;curBar.style.width='100%'});
      };
      v.onended=()=>show(idx+1);
      mediaBox.append(v);
    }else{
      const im=new Image();im.src=st.media;
      mediaBox.append(im);
      requestAnimationFrame(()=>{curBar.style.transition='width 5000ms linear';curBar.style.width='100%'});
      timer=setTimeout(()=>show(idx+1),5000);
    }
  };
  mediaBox.onclick=e=>{
    const x=e.clientX;
    if(x<innerWidth/2)show(idx+1);else show(idx-1);
  };
  show(0);
}

function addContactModal(){
  modal((b,close)=>{
    b.append(el('h3',null,'افزودن مخاطب'));
    const inp=field(b,'نام کاربری (@آیدی) یا شماره تلفن');
    const er=el('div','err');
    const ok=el('button','btn','افزودن به مخاطبین');
    ok.onclick=async()=>{
      const v=inp.value.trim();if(!v)return er.textContent='مقداری وارد کن';
      er.textContent='';
      let targetUid=null;
      const un=clean(v.replace(/^@/,''));
      if(un){targetUid=(await get(ref(db,'usernames/'+un))).val()}
      if(!targetUid){
        const ph=normPhone(v);
        if(ph.length>=10)targetUid=(await get(ref(db,'phones/'+ph))).val();
      }
      if(!targetUid)return er.textContent='کاربری با این مشخصات پیدا نشد';
      if(targetUid===uid)return er.textContent='نمی‌توانی خودت را اضافه کنی';
      const u=await getUser(targetUid);
      await set(ref(db,'contacts/'+uid+'/'+targetUid),{name:u.name||un,addedAt:Date.now()});
      close();toast((u.name||'کاربر')+' به مخاطبین اضافه شد');
    };
    b.append(er,ok);closeBtn(b,close);
  });
}

/* ---------- list & search ---------- */
function rowFor(id,d,onclick){
  const r=el('div','row'+(id===cur?' on':'')),a=el('div','av');setAv(a,d.photo,d.icon||d.name);
  const t=el('div'),b=el('b',null,d.name||''),k={channel:'کانال',group:'گروه',bot:'ربات'}[d.type];
  if(k)b.append(el('i','tag',k));
  t.append(b,el('span',null,d.sub||d.lastText||(d.handle?'@'+d.handle:'')));r.append(a,t);
  if(chats[id]&&id!==cur&&d.lastTs>(reads[id]||0)&&d.lastBy&&d.lastBy!==uid)r.append(el('div','badge','جدید'));
  r.onclick=onclick;return r;
}
function renderList(){
  if($('q').value.trim())return;

async function infoModal(){
  const d=curData,g=d.type==='group'||d.type==='channel';let other=null,otherId=null;
  if(d.type==='dm'){otherId=Object.keys(d.members||{}).find(k=>k!==uid);other=await getUser(otherId)}
  modal((b,close)=>{
    const av=el('div','av lg');av.style.margin='0 auto';setAv(av,d.photo,d.icon||d.name);
    b.append(av,el('h3',null,d.name||''));
    if(d.handle)b.append(el('div','mut','@'+d.handle));
    const t=other?other.bio:d.desc;if(t)b.append(el('p',null,t));
    if(otherId){const pb=el('button','btn','مشاهده پروفایل کامل');pb.onclick=()=>{close();userProfileModal(otherId,other)};b.append(pb)}
    if(g){b.append(el('div','mut',Object.keys(d.members||{}).length+' عضو'));const mb=el('button','btn','مشاهده اعضا و عکس‌ها');mb.onclick=()=>{close();membersModal()};b.append(mb)}
    closeBtn(b,close);
  });
}

/* ---------- پروفایل کامل کاربر (عکس‌ها، نام، نام کاربری، بیوگرافی + حذف از گروه/کانال با نگه‌داشتن ۲ ثانیه) ---------- */
async function userProfileModal(targetId,u){
  if(!u)u=await getUser(targetId);
  const id=cur,d=curData;
  const isGrpOrCh=d&&(d.type==='group'||d.type==='channel')&&d.members&&d.members[targetId];
  const rawPhotos=(await get(ref(db,'userPhotos/'+targetId))).val()||[];
  const photos=Object.values(rawPhotos);
  if(u.photo&&!photos.includes(u.photo))photos.unshift(u.photo);

  modal((b,close)=>{
    const av=el('div','av lg');av.style.margin='0 auto';setAv(av,u.photo,u.name);
    if(u.photo){av.onclick=()=>{const w=window.open();w.document.write('<img style="max-width:100%" src="'+u.photo+'">')}}
    b.append(av,el('h3',null,u.name||'کاربر'));
    if(u.username)b.append(el('div','mut','@'+u.username));
    if(u.phone)b.append(el('div','mut',u.phone));
    if(u.bio){
      const bioCard=el('div','card');bioCard.style.textAlign='start';
      bioCard.append(el('div','sec','بیوگرافی'),el('div',null,u.bio));
      b.append(bioCard);
    }
    if(photos.length){
      b.append(el('div','sec','عکس‌های پروفایل ('+photos.length+')'));
      const ths=el('div','ths');
      photos.forEach(p=>{
        const t=el('div','th'+(p===u.photo?' on':''));
        t.style.backgroundImage='url('+p+')';
        t.onclick=()=>{setAv(av,p,u.name);ths.querySelectorAll('.th').forEach(x=>x.classList.remove('on'));t.classList.add('on')};
        ths.append(t);
      });
      b.append(ths);
    }
    const adm=!!(isGrpOrCh&&d.admins&&d.admins[targetId]);
    if(isGrpOrCh){
      b.append(el('div','mut','نقش در '+kind(d)+': '+(targetId===d.owner?'مالک':adm?'مدیر':'عضو')));
    }
    const add=(t,f,cls='btn')=>{const x=el('button',cls,t);x.onclick=async()=>{close();await f()};b.append(x)};
    if(targetId!==uid){
      add('ارسال پیام شخصی',()=>openDM(targetId));
      if(!contacts[targetId]){
        add('افزودن به مخاطبین',()=>set(ref(db,'contacts/'+uid+'/'+targetId),{name:u.name||'کاربر',addedAt:Date.now()}).then(()=>toast('به مخاطبین اضافه شد')),'btn g');
      }
    }
    if(isGrpOrCh&&isOwner(d)&&targetId!==uid){
      if(adm)add('لغو مدیریت',()=>update(ref(db),{['chats/'+id+'/admins/'+targetId]:null}).then(()=>toast('مدیریت لغو شد')),'btn g');
      else add('ارتقا به مدیر',()=>update(ref(db),{['chats/'+id+'/admins/'+targetId]:true}).then(()=>toast('به مدیر ارتقا یافت')),'btn g');
    }
    if(isGrpOrCh&&targetId!==uid&&targetId!==d.owner&&(isOwner(d)||(isAdm(d)&&!adm))){
      add('حذف از '+kind(d),()=>{
        if(confirm(`${u.name||'این کاربر'} از ${kind(d)} حذف شود؟`)){
          return update(ref(db),{['chats/'+id+'/members/'+targetId]:null,['chats/'+id+'/admins/'+targetId]:null,['userChats/'+targetId+'/'+id]:null}).then(()=>toast('از '+kind(d)+' حذف شد'));
        }
      },'btn danger');
    }
    closeBtn(b,close);
  });
}

/* ---------- مدیریت اعضا (مشاهده اعضا و عکس‌هایشان + کلیک برای پروفایل + نگه‌داشتن ۲ ثانیه برای حذف از گروه/کانال) ---------- */
function membersModal(){
  const id=cur,d=curData;
  modal((b,close)=>{
    b.append(el('h3',null,'اعضای '+kind(d)+' ('+Object.keys(d.members||{}).length+')'));
    if(staff(d))b.append(el('div','mut','برای پروفایل بزنید • برای حذف ۲ ثانیه نگه دارید'));
    const L=el('div');L.style.cssText='display:flex;flex-direction:column;gap:2px;overflow:auto';b.append(L);
    (async()=>{
      const ids=Object.keys(d.members||{}).slice(0,200),us=await Promise.all(ids.map(i=>getUser(i)));
      const rank=i=>d.owner===i?0:(d.admins&&d.admins[i])?1:2;
      ids.map((i,k)=>[i,us[k]]).sort((a,c)=>rank(a[0])-rank(c[0])).forEach(([i,u])=>{
        const r=el('div','row'),a=el('div','av');setAv(a,u.photo,u.name);
        const t=el('div'),bn=el('b',null,u.name||'کاربر'),role=rank(i)===0?'مالک':rank(i)===1?'مدیر':'';
        if(role)bn.append(el('i','tag',role));
        t.append(bn,el('span',null,u.username?'@'+u.username:(u.bio||'')));r.append(a,t);

        const adm=!!(d.admins&&d.admins[i]);
        const canKick=i!==uid&&i!==d.owner&&(isOwner(d)||(isAdm(d)&&!adm));
        let tm,held=false;
        const stop=()=>{clearTimeout(tm);r.classList.remove('hold')};
        r.addEventListener('pointerdown',e=>{
          if(e.button>0||!canKick)return;
          held=false;r.classList.add('hold');
          tm=setTimeout(()=>{
            held=true;r.classList.remove('hold');
            modal((mb,mclose)=>{
              mb.append(el('h3',null,u.name||'کاربر'));
              const kBtn=el('button','btn danger','حذف از '+kind(d));
              kBtn.onclick=async()=>{
                mclose();close();
                await update(ref(db),{['chats/'+id+'/members/'+i]:null,['chats/'+id+'/admins/'+i]:null,['userChats/'+i+'/'+id]:null});
                toast('از '+kind(d)+' حذف شد');
              };
              mb.append(kBtn);closeBtn(mb,mclose);
            });
          },2000);
        });
        ['pointerup','pointerleave','pointercancel'].forEach(ev=>r.addEventListener(ev,stop));
        r.onclick=()=>{if(!held){close();userProfileModal(i,u)}};
        L.append(r);
      });
    })();
    closeBtn(b,close);
  });
}

function editChatModal(){
  const id=cur,d=curData;let ph=d.photo||'';
  modal((b,close)=>{
    b.append(el('h3',null,'ویرایش '+kind(d)));
    const av=el('div','av lg');av.style.margin='0 auto';setAv(av,ph,d.name);
    av.onclick=async()=>{const f=await pick($('fAv'));if(f){ph=await shrink(f,256,.8);setAv(av,ph,d.name)}};
    b.append(av,el('div','mut','برای تغییر عکس بزن'));
    const n=field(b,'نام',d.name),bio=field(b,'بیوگرافی / توضیحات',d.desc,1);
    const ok=el('button','btn','ذخیره'),rp=el('button','btn g','حذف عکس');
    rp.onclick=()=>{ph='';setAv(av,'',d.name)};
    ok.onclick=async()=>{const nm=n.value.trim();if(!nm)return toast('نام را وارد کن');await update(ref(db,'chats/'+id),{name:nm,desc:bio.value.trim(),photo:ph});close();toast('ذخیره شد')};
    b.append(ok,rp);closeBtn(b,close);
  });
}
</script>
