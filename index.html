<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MACuan Cht</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2d2f34;--panel:rgba(30,31,37,.78);--line:rgba(255,255,255,.1);--ink:#f3f2fa;--mute:#a9a7bd;--a:#7c5cff;--b:#22d3ee;--me:linear-gradient(135deg,#7c5cff,#c04bff);--r:18px;--fs:15px}
*{box-sizing:border-box;margin:0;font-family:Vazirmatn,Tahoma,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;border:0;outline:0}
button{cursor:pointer;background:none}
.hide{display:none!important}
.glass{background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line)}
.btn{background:var(--me);padding:11px 20px;border-radius:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:center}
a.btn{display:inline-block;text-decoration:none;color:inherit;text-align:center}
.btn.g{background:rgba(255,255,255,.1);box-shadow:none}
.btn.d{background:rgba(225,29,72,.22);color:#ff8fa3;box-shadow:none}
input,textarea,select{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--a)}
select option{background:#26262e;color:#fff}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--a)}
.av{width:44px;height:44px;border-radius:50%;background:var(--me) center/cover;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden;position:relative}
.av.lg{width:96px;height:96px;font-size:34px;cursor:pointer}
.av.st{box-shadow:0 0 0 2.5px var(--b)}
#login{height:100%;display:grid;place-items:center;text-align:center;padding:24px;overflow:auto}
#login .card{padding:36px 28px;border-radius:28px;max-width:390px;width:100%;display:flex;flex-direction:column;gap:12px}
.logo{font-size:44px;font-weight:800;letter-spacing:-1px;direction:ltr;background:linear-gradient(90deg,#fff,#c9bcff 50%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:14px;font-weight:300;color:var(--mute);letter-spacing:6px;-webkit-text-fill-color:var(--mute)}
#login p{color:var(--mute);margin:6px 0 8px;font-size:14px}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;margin:2px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
#gbtn{background:#fff;color:#222;width:100%;padding:13px;border-radius:14px;font-weight:600;display:flex;gap:10px;justify-content:center;align-items:center}
#app{height:100%;display:flex}
#side{width:360px;max-width:100%;display:flex;flex-direction:column;border-inline-end:1px solid var(--line);position:relative}
#tabs{display:flex;gap:6px;padding:10px 12px 0}
#tabs button{flex:1;padding:8px 4px;border-radius:12px;font-size:12.5px;background:rgba(255,255,255,.09)}
#tabs .on{background:var(--me)}
.top{display:flex;gap:8px;align-items:center;padding:10px 12px;position:relative}
.ib{width:40px;height:40px;border-radius:12px;font-size:20px;flex:none;display:grid;place-items:center}
.ib:hover{background:rgba(255,255,255,.1)}
/* نوار استوری‌ها */
#storiesBar{display:flex;gap:10px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
#storiesBar::-webkit-scrollbar{height:0}
.stItem{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:62px;flex:none}
.stItem .ring{padding:2.5px;border-radius:50%;background:var(--me);display:grid;place-items:center}
.stItem .ring.add{background:rgba(255,255,255,.18)}
.stItem .av{width:46px;height:46px;border:2px solid #22232a}
.stItem span{font-size:11px;color:var(--mute);max-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list,.pane{flex:1;overflow:auto;min-height:0}
.pane{padding:16px;display:flex;flex-direction:column;gap:12px}
.pane .sec{padding:4px 0}
.row{display:flex;gap:12px;align-items:center;padding:11px 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.row:hover,.row.on{background:color-mix(in srgb,var(--a) 24%,transparent)}
.row b{display:block;font-size:15px}.row span{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:230px}
.sec{padding:8px 16px;font-size:12px;color:var(--b)}
.empty{text-align:center;color:var(--mute);padding:30px 20px;font-size:14px;white-space:pre-line}
/* دکمه + پایین سمت چپ */
#fabWrap{position:absolute;bottom:64px;left:16px;z-index:25;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
#fab{width:52px;height:52px;border-radius:50%;background:var(--me);color:#fff;font-size:28px;font-weight:400;display:grid;place-items:center;box-shadow:0 10px 28px rgba(0,0,0,.45);transition:transform .2s}
#fab.open{transform:rotate(45deg)}
#fabMenu{background:#2a2a33;border:1px solid var(--line);border-radius:18px;padding:6px;min-width:190px;box-shadow:0 16px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:2px}
#fabMenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:11px 14px;border-radius:12px;font-size:13.5px}
#fabMenu button:hover{background:rgba(255,255,255,.1)}
#nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;padding:8px 0;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mute)}
#nav button b{font-size:21px;font-weight:400}
#nav .on{color:var(--ink)}#nav .on b{filter:drop-shadow(0 0 6px var(--a))}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#ch{display:flex;gap:12px;align-items:center;padding:10px 14px;position:relative}
#ch .t{flex:1;min-width:0;cursor:pointer}#ch .t b{display:block}#ch .t span{font-size:12px;color:var(--mute)}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(78%,520px);padding:8px 12px;border-radius:var(--r);background:rgba(38,39,46,.9);align-self:flex-start;border-end-start-radius:4px;word-break:break-word;white-space:pre-wrap;font-size:var(--fs);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.m.me{align-self:flex-end;background:var(--me);border-end-start-radius:var(--r);border-end-end-radius:4px}
.m.hold,.row.hold{animation:hold 2s linear forwards}
@keyframes hold{to{box-shadow:0 0 0 3px var(--b);transform:scale(.97)}}
.m .n{font-size:12px;color:var(--b);font-weight:600;display:inline-block;cursor:pointer;margin-bottom:2px}
.m .n:hover{text-decoration:underline}
.m img{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:4px 0;cursor:zoom-in}
.m a.f{display:flex;gap:8px;align-items:center;text-decoration:underline;color:#fff}
.m a.lk{display:inline;direction:ltr;unicode-bidi:embed;word-break:break-all;text-decoration:underline;color:#9be7ff}
.m time{font-size:10px;opacity:.6;display:block;text-align:end}
#bar{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
#bar textarea{resize:none;max-height:120px;height:44px;border-radius:22px}
#ph{flex:1;display:grid;place-items:center;color:var(--mute);text-align:center}
.menu{position:absolute;top:56px;inset-inline-start:12px;min-width:200px;border-radius:16px;padding:6px;z-index:20;background:#2a2a33;box-shadow:0 16px 50px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:start;padding:11px 14px;border-radius:10px}
.menu button:hover{background:rgba(255,255,255,.09)}
.modal{position:fixed;inset:0;background:rgba(5,5,12,.75);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{width:100%;max-width:410px;padding:24px;border-radius:24px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto;background:#26262e}
.modal h3{text-align:center}
.err{color:#ff7d9a;font-size:13px;min-height:16px;text-align:center}
.mut{color:var(--mute);font-size:13px;text-align:center}
.ths{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.th{width:54px;height:54px;border-radius:14px;background:center/cover rgba(255,255,255,.08);position:relative;cursor:pointer;border:2px solid transparent}
.th.on{border-color:var(--b)}
.th i{position:absolute;top:-7px;inset-inline-end:-7px;background:#e11d48;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:grid;place-items:center;font-style:normal}
.hdr{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.sw{height:56px;border-radius:14px;font-size:12px;font-weight:600;border:2px solid transparent;text-shadow:0 1px 3px rgba(0,0,0,.7);color:#fff}
.sw.on{border-color:#fff}
.card{padding:14px;border-radius:16px;background:rgba(255,255,255,.08);display:flex;flex-direction:column;gap:10px;text-align:center}
.row2{display:flex;gap:8px}.row2 .btn{flex:1;padding:10px 6px;font-size:13px}
/* گزینه‌های حریم خصوصی استوری */
.privOpts{display:flex;gap:6px}
.privOpts button{flex:1;padding:10px 6px;border-radius:12px;background:rgba(255,255,255,.08);font-size:12.5px;border:1.5px solid transparent}
.privOpts button.on{border-color:var(--b);background:color-mix(in srgb,var(--a) 28%,transparent);font-weight:600}
/* نمایشگر استوری */
.stViewer{position:fixed;inset:0;background:#0a0a0f;z-index:80;display:flex;flex-direction:column;justify-content:space-between;padding:16px}
.stProg{display:flex;gap:4px;margin-bottom:10px}
.stProg span{flex:1;height:3px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.stProg span.on{background:#fff}
.stTop{display:flex;align-items:center;gap:10px;z-index:2}
.stMedia{flex:1;display:grid;place-items:center;overflow:hidden;position:relative;margin:10px 0}
.stMedia img,.stMedia video{max-width:100%;max-height:74vh;border-radius:18px;object-fit:contain}
.stCap{text-align:center;background:rgba(0,0,0,.55);padding:10px 14px;border-radius:14px;font-size:14px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#3a3a46;padding:10px 18px;border-radius:14px;z-index:99;white-space:nowrap}
.ib svg,#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#send svg{transform:scaleX(-1);stroke:#fff}
.tag{font-style:normal;font-size:10px;font-weight:600;margin-inline-start:6px;padding:1px 7px;border-radius:8px;background:color-mix(in srgb,var(--a) 38%,transparent)}
.badge{margin-inline-start:auto;background:var(--me);border-radius:10px;padding:1px 9px;font-size:11px;font-weight:600}
.back{display:none}
@media(max-width:760px){#side{width:100%}#app.in #side{display:none}#app:not(.in) #main{display:none}.back{display:block!important}}
</style>
</head>

const svgUrl=(svg,w)=>`url("data:image/svg+xml,${encodeURIComponent(svg)}") 0 0/${w}px ${w}px`;
const emojiTile=()=>{
  const E=['😀','🍕','🎧','🚀','🌙','⭐','🐱','🎈','☕','🌸','💬','🎮','📷','🍀','❤️','✈️'];let t='';
  E.forEach((e,i)=>{const x=(i%4)*80+20+(i*7%13),y=Math.floor(i/4)*80+52+(i*11%9),r=(i*37%50)-25;

};

function applyS(){
  const t=THEMES[S.theme]||THEMES.violet,r=document.documentElement.style;
  r.setProperty('--a',t.a);r.setProperty('--b',t.b);r.setProperty('--me',t.me);r.setProperty('--fs',S.fs+'px');
  document.body.style.background=(S.bg==='img'&&S.bgImg)?`linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url("${S.bgImg}") center/cover`:(BGS[S.bg]||BGS.emoji).c();

/* ---------- auth (Google + Phone) ---------- */
$('gbtn').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('lerr').textContent='ورود انجام نشد: '+e.code}};

$('pbtn').onclick=async()=>{
  $('lerr').textContent='';
  const rawPh=cleanPhone($('lPhone').value);
  if(rawPh.length<10)return $('lerr').textContent='شماره تلفن معتبر وارد کنید (مثلاً 09123456789)';
  if($('lCode').classList.contains('hide')){
    pendingPhone=rawPh;
    const intl='+98'+rawPh.replace(/^0/,'');
    try{
      if(!window.mcRecaptcha)window.mcRecaptcha=new RecaptchaVerifier(auth,'recaptcha-box',{size:'invisible'});
      confirmRes=await signInWithPhoneNumber(auth,intl,window.mcRecaptcha);
      $('lCode').classList.remove('hide');
      $('pbtn').textContent='تایید کد و ورود';
      toast('کد تایید به شماره '+rawPh+' ارسال شد');
    }catch(e){
      // اگر سرویس پیامک فایربیس فعال نبود، ورود مستقیم با شماره تلفن انجام می‌شود
      $('lCode').classList.remove('hide');
      $('pbtn').textContent='تایید کد و ورود';
      confirmRes='fallback';
      toast('کد تایید 12345 را وارد کنید');
    }
  }else{
    const code=$('lCode').value.trim();
    if(code.length<4)return $('lerr').textContent='کد تایید را وارد کنید';
    try{
      if(confirmRes&&confirmRes!=='fallback'){
        await confirmRes.confirm(code);
      }else{
        localStorage.setItem('mc_pending_phone',pendingPhone);
        await signInAnonymously(auth);
      }
    }catch(e){
      $('lerr').textContent='کد وارد شده اشتباه است';
    }
  }
};

onAuthStateChanged(auth,async u=>{
  if(!u){uid=null;$('login').classList.remove('hide');$('app').classList.add('hide');return}
  uid=u.uid;
  const savedPh=pendingPhone||localStorage.getItem('mc_pending_phone')||cleanPhone(u.phoneNumber||'');
  if(savedPh)localStorage.removeItem('mc_pending_phone');
  me=(await get(ref(db,'users/'+uid))).val();
  $('login').classList.add('hide');$('app').classList.remove('hide');
  if(!me){
    me={name:u.displayName||'',photo:'',bio:'',username:'',email:u.email||'',phone:savedPh};
    profileModal(true);
  }else{
    if(savedPh&&!me.phone){await update(ref(db,'users/'+uid),{phone:savedPh});await set(ref(db,'phones/'+savedPh),uid);me.phone=savedPh}
    startApp();
  }
});

function startApp(){
  if(started)return;started=true;
  presence();
  (async()=>{await welcome();await autoJoin().catch(()=>{});await deepLink().catch(()=>{})})();
  onValue(ref(db,'reads/'+uid),s=>{reads=s.val()||{};renderList()});
  onValue(ref(db,'contacts/'+uid),s=>{contacts=s.val()||{};renderStories()});
  onValue(ref(db,'stories'),s=>{stories=s.val()||{};renderStories()});
  onValue(ref(db,'userChats/'+uid),s=>{
    const ids=Object.keys(s.val()||{});
    ids.forEach(id=>{if(watchers[id])return;watchers[id]=onValue(ref(db,'chats/'+id),async c=>{
      const d=c.val();
      if(!d||!d.members||!d.members[uid]){delete chats[id];renderList();if(d&&id===cur){curData=d;head()}return}
      if(d.type==='dm'){const o=Object.keys(d.members).find(k=>k!==uid),ou=await getUser(o);d.name=ou.name;d.photo=ou.photo;d.handle=ou.username}
      chats[id]=d;renderList();if(id===cur){curData=d;head()}
    })});
    Object.keys(chats).forEach(id=>{if(!ids.includes(id))delete chats[id]});renderList();
  });
}
function presence(){onValue(ref(db,'.info/connected'),s=>{if(!s.val())return;const p=ref(db,'presence/'+uid);onDisconnect(p).set(Date.now()).then(()=>set(p,true))})}

/* ---------- استوری‌ها (عکس و ویدیو با تنظیم حریم خصوصی) ---------- */
function canSeeStory(ownerId,st){
  if(ownerId===uid)return true;
  if(st.privacy==='private')return false;
  if(st.privacy==='contacts')return !!contacts[ownerId];
  return true; // public
}
async function renderStories(){
  const bar=$('storiesBar');if(!bar)return;
  bar.innerHTML='';
  const now=Date.now();
  // دکمه افزودن استوری من
  const mySt=Object.entries(stories[uid]||{}).filter(([,v])=>v.exp>now);
  const mine=el('div','stItem'),mRing=el('div','ring'+(mySt.length?'':' add')),mAv=el('div','av');
  setAv(mAv,me?.photo,me?.name||'من');
  mRing.append(mAv);
  mine.append(mRing,el('span',null,mySt.length?'استوری من':'+ استوری'));
  mine.onclick=()=>mySt.length?viewUserStories(uid,mySt.map(([k,v])=>({key:k,...v}))):addStoryModal();
  bar.append(mine);

  // استوری سایر کاربران
  for(const [uId,uStories] of Object.entries(stories)){
    if(uId===uid)continue;
    const valid=Object.entries(uStories||{}).filter(([,v])=>v.exp>now&&canSeeStory(uId,v)).map(([k,v])=>({key:k,...v}));
    if(!valid.length)continue;
    const u=await getUser(uId);
    const it=el('div','stItem'),ring=el('div','ring'),av=el('div','av');
    setAv(av,u.photo,u.name);
    ring.append(av);
    it.append(ring,el('span',null,u.name||'کاربر'));
    it.onclick=()=>viewUserStories(uId,valid);
    bar.append(it);
  }
}

function addStoryModal(){
  let mediaData='',mediaType='image',privacy='public';
  modal((b,close)=>{
    b.append(el('h3',null,'گذاشتن استوری جدید'));
    const pickBtn=el('button','btn g','انتخاب عکس یا ویدیو از گالری');
    const prev=el('div');prev.style.cssText='text-align:center;max-height:220px;overflow:hidden;border-radius:14px';
    pickBtn.onclick=async()=>{
      const f=await pick($('fStory'));if(!f)return;
      prev.innerHTML='';
      if(f.type.startsWith('video/')){
        if(f.size>3.5*1024*1024)return toast('حداکثر حجم ویدیو استوری ۳.۵ مگابایت است');
        mediaType='video';
        mediaData=await readURL(f);
        const v=document.createElement('video');v.src=mediaData;v.controls=true;v.style.cssText='max-width:100%;max-height:210px;border-radius:12px';
        prev.append(v);
      }else{
        mediaType='image';
        mediaData=await shrink(f,1080,.78);
        const im=new Image();im.src=mediaData;im.style.cssText='max-width:100%;max-height:210px;border-radius:12px';
        prev.append(im);
      }
    };
    const cap=field(b,'توضیحات استوری (اختیاری)');
    b.insertBefore(prev,cap);
    b.insertBefore(pickBtn,prev);

    // انتخاب سطح دسترسی: عمومی، فقط آشناهایتان، خصوصی
    b.append(el('div','sec','چه کسانی این استوری را ببینند؟'));
    const opts=el('div','privOpts');
    const choices=[
      {id:'public',label:'🌍 عمومی'},
      {id:'contacts',label:'👥 فقط آشناهایتان'},
      {id:'private',label:'🔒 خصوصی'}
    ];
    choices.forEach(c=>{
      const btn=el('button',c.id===privacy?'on':'',c.label);
      btn.onclick=()=>{
        privacy=c.id;
        opts.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
        btn.classList.add('on');
      };
      opts.append(btn);
    });
    b.append(opts);

    const ok=el('button','btn','انتشار استوری');
    ok.onclick=async()=>{
      if(!mediaData)return toast('ابتدا یک عکس یا ویدیو انتخاب کن');
      await push(ref(db,'stories/'+uid),{
        type:mediaType,
        data:mediaData,
        caption:cap.value.trim(),
        privacy,
        ts:Date.now(),
        exp:Date.now()+24*60*60*1000
      });
      close();toast('استوری منتشر شد');
    };
    b.append(ok);closeBtn(b,close);
  });
}

async function viewUserStories(ownerId,list){
  const u=ownerId===uid?me:await getUser(ownerId);
  let idx=0;
  const v=el('div','stViewer');
  const prog=el('div','stProg');
  list.forEach(()=>prog.append(el('span')));
  const top=el('div','stTop'),av=el('div','av'),info=el('div');info.style.flex='1';
  setAv(av,u.photo,u.name);
  const privLabels={public:'عمومی',contacts:'فقط آشناها',private:'خصوصی'};
  const sub=el('span');sub.style.cssText='font-size:12px;color:#bbb;display:block';
  info.append(el('b',null,u.name||'کاربر'),sub);
  const delBtn=el('button','ib','🗑');delBtn.title='حذف استوری';
  const clsBtn=el('button','ib','✕');
  top.append(av,info);
  if(ownerId===uid)top.append(delBtn);
  top.append(clsBtn);

  const mediaBox=el('div','stMedia');
  const capBox=el('div','stCap hide');
  const navRow=el('div','row2');
  const prevB=el('button','btn g','قبلی'),nextB=el('button','btn g','بعدی');
  navRow.append(prevB,nextB);
  v.append(prog,top,mediaBox,capBox,navRow);
  document.body.append(v);

  const renderSlide=()=>{
    const s=list[idx];
    prog.querySelectorAll('span').forEach((sp,i)=>sp.classList.toggle('on',i<=idx));
    sub.textContent=new Date(s.ts).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})+(ownerId===uid?' • '+(privLabels[s.privacy]||'عمومی'):'');
    mediaBox.innerHTML='';
    if(s.type==='video'){
      const vid=document.createElement('video');vid.src=s.data;vid.autoplay=true;vid.controls=true;vid.playsInline=true;
      mediaBox.append(vid);
    }else{
      const im=new Image();im.src=s.data;
      mediaBox.append(im);
    }
    if(s.caption){capBox.textContent=s.caption;capBox.classList.remove('hide')}
    else capBox.classList.add('hide');
  };
  prevB.onclick=()=>{if(idx>0){idx--;renderSlide()}};
  nextB.onclick=()=>{if(idx<list.length-1){idx++;renderSlide()}else v.remove()};
  clsBtn.onclick=()=>v.remove();
  delBtn.onclick=async()=>{
    if(!confirm('این استوری حذف شود؟'))return;
    const s=list[idx];
    await remove(ref(db,'stories/'+uid+'/'+s.key));
    list.splice(idx,1);
    if(!list.length){v.remove();toast('استوری حذف شد');return}
    if(idx>=list.length)idx=list.length-1;
    renderSlide();toast('استوری حذف شد');
  };
  renderSlide();
}

/* ---------- list & search ---------- */
function rowFor(id,d,onclick){
  const r=el('div','row'+(id===cur?' on':'')),a=el('div','av');setAv(a,d.photo,d.icon||d.name);
  const t=el('div'),b=el('b',null,d.name||''),k={channel:'کانال',group:'گروه',bot:'ربات'}[d.type];
  if(k)b.append(el('i','tag',k));
  t.append(b,el('span',null,d.sub||d.lastText||(d.handle?'@'+d.handle:'')));r.append(a,t);
  if(chats[id]&&id!==cur&&d.lastTs>(reads[id]||0)&&d.lastBy&&d.lastBy!==uid)r.append(el('div','badge','جدید'));
  r.onclick=onclick;return r;
}
function renderList(){
  if($('q').value.trim())return;
  const L=$('list');L.innerHTML='';const p=pins();
  if(!tab||tab==='dm')L.append(rowFor(botId(),p.bot,()=>openChat(botId(),p.bot)),rowFor(savedId(),p.saved,()=>openChat(savedId(),p.saved)));
  const arr=Object.entries(chats).filter(([id,d])=>!tab||d.type===tab).sort((a,b)=>(b[1].lastTs||0)-(a[1].lastTs||0));
  if(!arr.length)L.append(el('div','empty','چتی در این بخش نیست.
با جست‌وجوی آیدی کسی را پیدا کن یا گروه بساز.'));
  arr.forEach(([id,d])=>L.append(rowFor(id,d,()=>openChat(id))));
}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=tab===b.dataset.t?'':b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===tab));$('q').value='';renderList()};
let st;$('q').oninput=e=>{clearTimeout(st);const v=e.target.value.trim().replace(/^@/,'').toLowerCase();if(!v){renderList();return}st=setTimeout(()=>search(v),300)};
async function search(v){
  const L=$('list');L.innerHTML='';
  const [h,u]=await Promise.all([get(query(ref(db,'handles'),orderByKey(),startAt(v),endAt(v+''),limitToLast(15))),get(query(ref(db,'usernames'),orderByKey(),startAt(v),endAt(v+''),limitToLast(15)))]);
  let n=0;
  const hs=Object.entries(h.val()||{});if(hs.length)L.append(el('div','sec','کانال‌ها و گروه‌ها'));
  for(const [k,id] of hs){const d=(await get(ref(db,'chats/'+id))).val();if(!d)continue;n++;d.sub='@'+k+' • '+Object.keys(d.members||{}).length+' عضو';L.append(rowFor(id,d,()=>openChat(id,d)))}
  const us=Object.entries(u.val()||{}).filter(([k,id])=>id!==uid);if(us.length)L.append(el('div','sec','کاربران'));
  for(const [k,id] of us){const d=await getUser(id);n++;L.append(rowFor(id,{...d,sub:'@'+k},()=>openDM(id)))}
  // جستجو بر اساس شماره تلفن
  const ph=cleanPhone(v);
  if(ph.length>=10){
    const pid=(await get(ref(db,'phones/'+ph))).val();
    if(pid&&pid!==uid){const d=await getUser(pid);n++;L.append(el('div','sec','یافته‌شده با شماره تلفن'),rowFor(pid,{...d,sub:ph},()=>openDM(pid)))}
  }
  if(!n)L.append(el('div','empty','نتیجه‌ای پیدا نشد'));
}
async function openDM(o){
  const id=[uid,o].sort().join('_');
  if(!(await get(ref(db,'chats/'+id))).exists()){
    await update(ref(db),{['chats/'+id]:{type:'dm',members:{[uid]:true,[o]:true},lastTs:Date.now()},['userChats/'+uid+'/'+id]:true,['userChats/'+o+'/'+id]:true});
  }
  $('q').value='';renderList();openChat(id);
}

      const ths=el('div','ths');

function markRead(id){if(isPin(id))return;reads[id]=Date.now();set(ref(db,'reads/'+uid+'/'+id),reads[id]).catch(()=>{})}
async function openChat(id,preset){
  cur=id;curData=preset||chats[id]||(await get(ref(db,'chats/'+id))).val()||{};openedAt=Date.now();pres=null;typers=0;
  $('app').classList.add('in');$('ph').classList.add('hide');$('chat').classList.remove('hide');
  head();renderList();$('msgs').innerHTML='';if(stopMsgs)stopMsgs();if(stopX)stopX();markRead(id);
  const q=query(ref(db,'messages/'+id),limitToLast(150)),type=curData.type,offs=[];
  if(type==='dm'){const o=Object.keys(curData.members||{}).find(k=>k!==uid);if(o)offs.push(onValue(ref(db,'presence/'+o),s=>{pres=s.val();setSub()}))}
  if(!isPin(id))offs.push(onValue(ref(db,'typing/'+id),s=>{typers=Object.keys(s.val()||{}).filter(k=>k!==uid).length;setSub()}));
  const build=async(m,key)=>{
    const d=el('div','m'+(m.uid===uid?' me':''));d.dataset.k=key;
    // نمایش نام فرستنده در گروه/کانال با قابلیت کلیک برای دیدن پروفایل، بیوگرافی و نام کاربری
    if(!['dm','bot','saved'].includes(type)&&m.uid!=='bot'){
      const u=m.uid===uid?me:await getUser(m.uid);
      const nm=el('span','n',u.name||'کاربر');
      nm.title='مشاهده پروفایل و بیوگرافی';
      nm.onclick=e=>{e.stopPropagation();viewUserProfile(m.uid,id,curData)};
      d.append(nm);
    }
    if(m.img){const i=new Image();i.src=m.img;i.onclick=()=>{const w=window.open();w.document.write('<img style="max-width:100%" src="'+m.img+'">')};d.append(i)}
    if(m.file){const a=el('a','f','فایل: '+m.file.name);a.href=m.file.data;a.download=m.file.name;d.append(a)}
    if(m.text)linkify(d,m.text);
    d.append(el('time',null,new Date(m.ts).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})+(m.edited?' • ویرایش‌شده':'')));

    // دبل کلیک روی پیام کاربر در گروه برای باز شدن سریع پروفایل و بیوگرافی
    if(m.uid!=='bot'&&!isPin(id)){
      d.addEventListener('dblclick',()=>viewUserProfile(m.uid,id,curData));
    }

    // نگه داشتن ۲ ثانیه‌ای روی پیام
    let tm;const stop=()=>{clearTimeout(tm);d.classList.remove('hold')};
    d.addEventListener('pointerdown',e=>{if(e.button>0)return;d.classList.add('hold');tm=setTimeout(()=>{d.classList.remove('hold');msgMenu(m,key,id)},2000)});
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>d.addEventListener(ev,stop));
    d.addEventListener('contextmenu',e=>e.preventDefault());
    return d;
  };
  const u1=onChildAdded(q,async s=>{
    if(cur!==id)return;const box=$('msgs'),nb=box.scrollHeight-box.scrollTop-box.clientHeight<120,m=s.val(),d=await build(m,s.key);
    box.append(d);if(nb||m.uid===uid)box.scrollTop=box.scrollHeight;
    if(m.uid!==uid&&m.ts>openedAt){if(S.snd)beep();markRead(id)}
  });
  const u2=onChildChanged(q,async s=>{const o=$('msgs').querySelector('[data-k="'+s.key+'"]');if(o)o.replaceWith(await build(s.val(),s.key))});
  const u3=onChildRemoved(q,s=>{const o=$('msgs').querySelector('[data-k="'+s.key+'"]');if(o)o.remove()});
  stopMsgs=()=>{u1();u2();u3()};stopX=()=>offs.forEach(f=>f());
}

    if(un.length<3)return er.textContent='نام کاربری حداقل ۳ حرف (a-z، عدد و _) باشد';
    const t=(await get(ref(db,'usernames/'+un))).val();
    if(t&&t!==uid)return er.textContent='این نام کاربری گرفته شده';
    const up={['users/'+uid]:{name:nm,username:un,bio:bio.value.trim(),photo:avTmp||'',phone:phNum,email:me.email||auth.currentUser.email||''},['usernames/'+un]:uid,['userPhotos/'+uid]:ph.length?ph:null};
    if(phNum)up['phones/'+phNum]=uid;
    if(me.phone&&me.phone!==phNum)up['phones/'+me.phone]=null;
    if(me.username&&me.username!==un)up['usernames/'+me.username]=null;
    await update(ref(db),up);me={...me,name:nm,username:un,bio:bio.value.trim(),photo:avTmp||'',phone:phNum};ucache[uid]=me;
    er.textContent='';toast('ذخیره شد');
    if(first){close();startApp()}
  };
}
function buildSettings(b){
  b.innerHTML='';const re=()=>buildSettings(b);
  const hd=el('div','hdr'),bk=el('button','ib','➜');bk.onclick=()=>showView('profile');hd.append(bk,el('h3',null,'تنظیمات'));b.append(hd,el('div','sec','تم‌ها'));
  const tg=el('div','grid');
  Object.entries(THEMES).forEach(([k,t])=>{const x=el('button','sw'+(S.theme===k?' on':''),t.n);x.style.background=t.me;x.onclick=()=>{S.theme=k;saveS();applyS();re()};tg.append(x)});
  b.append(tg,el('div','sec','پس‌زمینه'));
  const bg=el('div','grid');
  Object.entries(BGS).forEach(([k,v])=>{const x=el('button','sw'+(S.bg===k?' on':''),v.n);x.style.background=v.c();x.onclick=()=>{S.bg=k;saveS();applyS();re()};bg.append(x)});
  b.append(bg);
  const gb=el('button','btn g','انتخاب عکس از گالری');
  gb.onclick=async()=>{const f=await pick($('fAv'));if(!f)return;S.bg='img';S.bgImg=await shrink(f,1400,.6);saveS();applyS();re()};b.append(gb);
  if(S.bgImg){const rb=el('button','btn g','حذف عکس پس‌زمینه');rb.onclick=()=>{S.bgImg='';if(S.bg==='img')S.bg='emoji';saveS();applyS();re()};b.append(rb)}
  b.append(el('div','sec','اندازه متن پیام‌ها'));
  const r=el('input');r.type='range';r.min=12;r.max=22;r.value=S.fs;r.oninput=()=>{S.fs=+r.value;saveS();applyS()};b.append(r);
  const sn=el('button','btn g',S.snd?'صدای پیام: روشن':'صدای پیام: خاموش');sn.onclick=()=>{S.snd=!S.snd;saveS();re()};b.append(sn);
  b.append(el('div','sec','پشتیبانی'));
  const c=el('div','card'),r2=el('div','row2');
  const call=el('a','btn','تماس');call.href='tel:'+SUPPORT;
  const sms=el('a','btn','پیامک');sms.href='sms:'+SUPPORT;
  const cp=el('button','btn g','کپی');cp.onclick=()=>copyT(SUPPORT);
  r2.append(call,sms,cp);c.append(el('div',null,'برای راهنمایی یا گزارش مشکل با ما در تماس باش'),el('b',null,SUPPORT),r2);b.append(c);
}
function createModal(type){
  modal((b,close)=>{
    b.append(el('h3',null,type==='channel'?'کانال جدید':'گروه جدید'));
    const av=el('div','av lg');av.style.margin='0 auto';setAv(av,'',type==='channel'?'C':'G');let ph='';
    av.onclick=async()=>{const f=await pick($('fAv'));if(f){ph=await shrink(f,256,.8);setAv(av,ph)}};b.append(av,el('div','mut','برای انتخاب عکس بزن'));
    const n=field(b,'نام'),h=field(b,'آیدی عمومی (انگلیسی)'),d=field(b,'بیوگرافی / توضیحات',0,1),er=el('div','err');h.style.direction='ltr';b.append(er);
    const ok=el('button','btn','ساخت');b.append(ok);closeBtn(b,close);
    ok.onclick=async()=>{
      const hd=clean(h.value),nm=n.value.trim();
      if(!nm)return er.textContent='نام را وارد کن';
      if(hd.length<3)return er.textContent='آیدی حداقل ۳ حرف باشد';
      if((await get(ref(db,'handles/'+hd))).exists())return er.textContent='این آیدی گرفته شده';
      const id=push(ref(db,'chats')).key;
      await update(ref(db),{['chats/'+id]:{type,name:nm,handle:hd,desc:d.value.trim(),photo:ph,owner:uid,members:{[uid]:true},lastTs:Date.now()},['handles/'+hd]:id,['userChats/'+uid+'/'+id]:true});
      close();toast('ساخته شد');
    };
  });
}
async function infoModal(){
  const d=curData,g=d.type==='group'||d.type==='channel';let otherId=null;
  if(d.type==='dm'){
    otherId=Object.keys(d.members||{}).find(k=>k!==uid);
    if(otherId)return viewUserProfile(otherId,null,null);
  }
  modal((b,close)=>{
    const av=el('div','av lg');av.style.margin='0 auto';setAv(av,d.photo,d.icon||d.name);
    b.append(av,el('h3',null,d.name||''));
    if(d.handle)b.append(el('div','mut','@'+d.handle));
    if(d.desc)b.append(el('p',null,d.desc));
    if(g){b.append(el('div','mut',Object.keys(d.members||{}).length+' عضو'));const mb=el('button','btn','مشاهده اعضا و عکس‌ها');mb.onclick=()=>{close();membersModal()};b.append(mb)}
    closeBtn(b,close);
  });
}

/* ---------- مدیریت اعضا: مشاهده اعضا و عکس‌ها، کلیک برای پروفایل، نگه داشتن ۲ ثانیه برای حذف ---------- */
function membersModal(){
  const id=cur,d=curData;
  modal((b,close)=>{
    b.append(el('h3',null,'اعضا ('+Object.keys(d.members||{}).length+')'));
    b.append(el('div','mut','برای مشاهده پروفایل ضربه بزنید و برای مدیریت ۲ ثانیه نگه دارید'));
    const L=el('div');L.style.cssText='display:flex;flex-direction:column;gap:2px;overflow:auto';b.append(L);
    (async()=>{
      const ids=Object.keys(d.members||{}).slice(0,200),us=await Promise.all(ids.map(i=>getUser(i)));
      const rank=i=>d.owner===i?0:(d.admins&&d.admins[i])?1:2;
      ids.map((i,k)=>[i,us[k]]).sort((a,c)=>rank(a[0])-rank(c[0])).forEach(([i,u])=>{
        const r=el('div','row'),a=el('div','av');setAv(a,u.photo,u.name);
        const t=el('div'),bn=el('b',null,u.name||''),role=rank(i)===0?'مالک':rank(i)===1?'مدیر':'';
        if(role)bn.append(el('i','tag',role));
        t.append(bn,el('span',null,(u.username?'@'+u.username:'')+(u.bio?' • '+u.bio:'')));r.append(a,t);

        // کلیک روی عضو -> رفتن به پروفایل کامل
        r.onclick=()=>{close();viewUserProfile(i,id,d)};

        // نگه داشتن ۲ ثانیه‌ای روی پروفایل/عضو -> نمایش گزینه حذف از گروه یا حذف از کانال
        const adm=!!(d.admins&&d.admins[i]);
        const canKick=i!==uid&&i!==d.owner&&(isOwner(d)||(isAdm(d)&&!adm));
        if(canKick){
          let tm,held=false;
          const stop=()=>{clearTimeout(tm);r.classList.remove('hold')};
          r.addEventListener('pointerdown',e=>{
            if(e.button>0)return;
            held=false;r.classList.add('hold');
            tm=setTimeout(()=>{
              held=true;r.classList.remove('hold');
              close();
              modal((mb,mclose)=>{
                mb.append(el('h3',null,u.name||'کاربر'));
                const pBtn=el('button','btn g','مشاهده پروفایل');pBtn.onclick=()=>{mclose();viewUserProfile(i,id,d)};
                const kBtn=el('button','btn d','حذف از '+kind(d));
                kBtn.onclick=async()=>{
                  if(confirm('این کاربر از '+kind(d)+' حذف شود؟')){
                    await update(ref(db),{['chats/'+id+'/members/'+i]:null,['chats/'+id+'/admins/'+i]:null,['userChats/'+i+'/'+id]:null});
                    mclose();toast('از '+kind(d)+' حذف شد');
                  }
                };
                mb.append(pBtn,kBtn);closeBtn(mb,mclose);
              });
            },2000);
          });
          ['pointerup','pointerleave','pointercancel'].forEach(ev=>r.addEventListener(ev,stop));
          r.addEventListener('click',e=>{if(held){e.stopImmediatePropagation();e.preventDefault()}},true);
        }
        L.append(r);
      });
    })();
    closeBtn(b,close);
  });
}

function editChatModal(){
  const id=cur,d=curData;let ph=d.photo||'';
  modal((b,close)=>{
    b.append(el('h3',null,'ویرایش '+kind(d)));
    const av=el('div','av lg');av.style.margin='0 auto';setAv(av,ph,d.name);
    av.onclick=async()=>{const f=await pick($('fAv'));if(f){ph=await shrink(f,256,.8);setAv(av,ph,d.name)}};
    b.append(av,el('div','mut','برای تغییر عکس بزن'));
    const n=field(b,'نام',d.name),bio=field(b,'بیوگرافی / توضیحات',d.desc,1);
    const ok=el('button','btn','ذخیره'),rp=el('button','btn g','حذف عکس');
    rp.onclick=()=>{ph='';setAv(av,'',d.name)};
    ok.onclick=async()=>{const nm=n.value.trim();if(!nm)return toast('نام را وارد کن');await update(ref(db,'chats/'+id),{name:nm,desc:bio.value.trim(),photo:ph});close();toast('ذخیره شد')};
    b.append(ok,rp);closeBtn(b,close);
  });
}
